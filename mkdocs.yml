site_name: Tipsy On Life
site_description: A personal website with blog and contact information
site_author: Ekta Kamboj
site_url: https://ektakamboj.github.io/tipsyonlife/

# Repository
repo_name: ektakamboj/tipsyonlife
repo_url: https://github.com/ektakamboj/tipsyonlife

# Theme configuration
theme:
  name: material
  
  # Responsive design features
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  
  # Color scheme with gradient theme
  palette:
    # Light mode
    - scheme: default
      primary: deep purple
      accent: pink
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    
    # Dark mode
    - scheme: slate
      primary: deep purple
      accent: pink
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  
  # Font configuration
  font:
    text: Roboto
    code: Roboto Mono
  
  # Logo and favicon
  icon:
    logo: material/flask-outline

# Navigation
nav:
  - Home: index.md
  - Blog:
    - blog/index.md
    - Posts:
      - Welcome Post: blog/posts/welcome.md
      - Getting Started: blog/posts/getting-started.md
  - Contact: contact.md

# Extensions for accessibility and features
markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  
  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Extra CSS for gradient theme
extra_css:
  - stylesheets/extra.css

# Plugins
plugins:
  - search

# Extra configuration
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ektakamboj/tipsyonlife
  
  # Analytics (optional)
  # analytics:
  #   provider: google
  #   property: UA-XXXXXXXX-X

# Copyright
copyright: Copyright &copy; 2024 Tipsy On Life
